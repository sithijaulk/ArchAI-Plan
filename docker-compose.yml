version: "3.9"

services:
  # ─────────────────── PostgreSQL (production database) ───────────────────
  db:
    image: postgres:16-alpine
    container_name: archai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: archai_plan
      POSTGRES_USER: ${DB_USER:-archai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-archai} -d archai_plan"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────── FastAPI Backend ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archai_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-archai}:${DB_PASSWORD:-archai}@db:5432/archai_plan
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: archai_plan
      DB_USER: ${DB_USER:-archai}
      DB_PASSWORD: ${DB_PASSWORD:-archai}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 10
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ─────────────────── Next.js Frontend ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: archai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
